name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack binary
        run: pnpm pack:bin

      - name: Verify artifact
        run: |
          test -f release/agent-gateway
          test -x release/agent-gateway
          ls -lh release/agent-gateway
          sha256sum release/agent-gateway > release/agent-gateway.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            下载 **agent-gateway** 二进制即可（linux-x64，需系统 Node ≥ 22.13）。

            > GitHub 会固定显示 Source code 链接，无法关闭；本仓库已用 `.gitattributes` 清空自动源码包内容，请只用上方二进制资源。
          files: |
            release/agent-gateway
            release/agent-gateway.sha256
