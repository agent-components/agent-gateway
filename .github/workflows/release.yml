name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack binary
        run: pnpm pack:bin

      - name: Verify artifact
        run: |
          test -f release/agent-gateway
          test -x release/agent-gateway
          ls -lh release/agent-gateway
          sha256sum release/agent-gateway > release/agent-gateway.sha256

      - name: Release notes from tag
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/agent-gateway
            release/agent-gateway.sha256
